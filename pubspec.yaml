name: flutter_steam_tv
description: A Flutter TV client based on the StreamTV product specification.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  flutter_tizen: ^0.2.7
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  json_annotation: ^4.12.0
  pretty_qr_code: ^3.6.0
  riverpod_annotation: ^4.0.7

  # Native playback. One Flutter API, a different native player per platform: Media3 on Android TV,
  # the Tizen media player on Samsung TV. See doc_architechture/native_player_bridge.md.
  stream_player:
    path: ../flutter_stream_player/packages/stream_player

  # Both hosts are direct dependencies because `lib/core/player/stream_player_host.dart` names them
  # explicitly — see the reasoning there. A pubspec is not per-platform, so each is listed for every
  # target; the flutter tool skips the native half of whichever one the target does not support.
  stream_player_android:
    path: ../flutter_stream_player/packages/stream_player_android
  stream_player_tizen:
    path: ../flutter_stream_player/packages/stream_player_tizen

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
