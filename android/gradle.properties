org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.47's Gradle plugin still calls the legacy applicationVariants API. Keep the template's
# compatibility flag until Flutter migrates to AndroidComponentsExtension, and suppress only the
# two AGP warnings caused by that documented opt-out.
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
# Flutter 3.47+ supports AGP 9's built-in Kotlin after all local plugins have migrated.
android.builtInKotlin=true
