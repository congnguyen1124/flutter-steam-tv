org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.47's Gradle plugin still calls the legacy applicationVariants API. Keep the template's
# compatibility flag until Flutter migrates to AndroidComponentsExtension, and suppress only the
# two AGP warnings caused by that documented opt-out.
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
# Built-in Kotlin is off: AGP 9.3.2 embeds Kotlin 2.2.10, and Flutter 3.47's Gradle plugin refuses
# anything below 2.2.20 — the build fails at plugin-apply time, before compiling anything. Turn this
# back on once AGP ships a release embedding 2.2.20 or newer, and drop the explicit KGP below.
android.builtInKotlin=false
